# Judge0 settings. CHANGE the three passwords/tokens below, then put the SAME token in server/.env as JUDGE0_AUTH_TOKEN.

# --- passwords (change these) ---
REDIS_HOST=redis
REDIS_PASSWORD=change-this-redis-password
POSTGRES_HOST=db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=change-this-db-password

# --- only requests that send "X-Auth-Token: <token>" are accepted (our server does this) ---
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=change-this-long-secret-token

# --- capacity for ~100 students: the default queue of 100 is too small when many students press Submit together ---
MAX_QUEUE_SIZE=2000
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20

# --- per-test limits for students' programs ---
CPU_TIME_LIMIT=2
WALL_TIME_LIMIT=6
MEMORY_LIMIT=256000
MAX_PROCESSES_AND_OR_THREADS=60
