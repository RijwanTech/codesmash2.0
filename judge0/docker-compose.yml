# Judge0 CE – the sandbox that runs students' code for Round 3.
# Start:   docker compose up -d db redis   (wait 10 seconds)   then   docker compose up -d
# Check:   open http://localhost:2358/docs
# Needs a LINUX machine with cgroup v1 (see JUDGE0_SETUP.md). Compare this file with the one in the official Judge0 release
# (https://github.com/judge0/judge0/releases) if something does not start.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 100m
    max-file: "5"

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    logging: *default-logging
    restart: always

  worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    logging: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data/
    logging: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    logging: *default-logging
    restart: always

volumes:
  judge0-data:
